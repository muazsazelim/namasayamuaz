<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mu'az Sazelim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, Georgia, serif;
            background: #f6f1e4;
            color: #17140f;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            text-underline-offset: 0.16em;
        }

        a:focus-visible {
            outline: 2px solid #17140f;
            outline-offset: 4px;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: clamp(2rem, 6vw, 5.5rem);
        }

        .top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 2rem;
            align-items: start;
        }

        .top-right {
            justify-self: end;
            text-align: left;
        }

        .phone,
        .university {
            font-size: clamp(1.35rem, 3.2vw, 2.2rem);
            line-height: 1;
        }

        .degree {
            display: block;
            margin-top: 0.45rem;
            font-size: clamp(0.92rem, 1.5vw, 1.2rem);
            line-height: 1.2;
        }

        .intro {
            align-self: center;
            justify-self: center;
            text-align: center;
            transform: translateY(5vh);
        }

        h1 {
            font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, Georgia, serif;
            font-size: clamp(3rem, 7.5vw, 5.5rem);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: 0.02em;
        }

        h1 .name-cap {
            text-transform: uppercase;
        }

        h1 .name-small {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            vertical-align: baseline;
        }

        .email {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: clamp(1.05rem, 2.3vw, 1.65rem);
            line-height: 1.1;
        }

        .bottom {
            justify-self: center;
            max-width: 100%;
            text-align: center;
            font-size: clamp(1rem, 1.9vw, 1.45rem);
            line-height: 1.45;
        }

        .bottom span,
        .bottom a {
            display: inline;
            white-space: nowrap;
        }

        .bottom a {
            font-weight: 700;
        }

        .bottom span + span::before,
        .bottom a::before {
            content: "|";
            padding: 0 0.45em;
        }

        @media (max-width: 760px) {
            .page {
                padding: 1.5rem;
                gap: 2rem;
            }

            .top {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .top-right {
                justify-self: start;
            }

            .intro {
                transform: none;
            }

            h1 {
                font-size: clamp(2.1rem, 11vw, 3rem);
            }

            .bottom span,
            .bottom a {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <main class="page" aria-label="Mu'az Sazelim profile">
        <header class="top">
            <a class="phone" href="https://wa.me/601123239058" aria-label="Message Mu'az Sazelim on WhatsApp">+60 1123239058</a>

            <div class="top-right">
                <p class="university">University of Sheffield</p>
                <p class="degree">Computer Science | 2nd Class Upper</p>
            </div>
        </header>

        <section class="intro" aria-labelledby="name">
            <h1 id="name"><span class="name-cap">M</span><span class="name-small">U'AZ</span> <span class="name-cap">S</span><span class="name-small">AZELIM</span></h1>
            <a class="email" href="mailto:muazsazelim019@gmail.com">muazsazelim019@gmail.com</a>
        </section>

        <footer class="bottom">
            <span>Bangi, Selangor</span>
            <span>Software Engineer at TM Research &amp; Development</span>
            <span>Prev at Lestari Alam Sekitar</span>
            <a href="https://www.linkedin.com/in/muazsazelim" rel="noopener noreferrer" target="_blank">LinkedIn</a>
        </footer>
    </main>
</body>
</html>
